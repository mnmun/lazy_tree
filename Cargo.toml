[package]
name = "lazy_tree"
description = "tree of lazily-created nodes with cursor-based traversal"
version = "0.0.0"
authors = ["mnmun <mnmnmun@proton.me>"]
homepage = "https://github.com/mnmun/lazy_tree"
repository = "https://github.com/mnmun/lazy_tree"
readme = "README.md"
exclude = ["diagrams", "flake.nix", "flake.lock"]
license = "MIT"
edition = "2024"

[dependencies]
document-features = "0.2.12"
getset = "0.1.7"

[dev-dependencies]
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
